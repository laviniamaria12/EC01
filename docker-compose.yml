services:
  # Ambiente de desenvolvimento: serve os arquivos locais (alterações aparecem ao recarregar a página)
  web:
    image: nginx:1.27-alpine
    container_name: ec01-devtech
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./js:/usr/share/nginx/html/js:ro

  # Executa os testes da classe Aluno e dos relatórios com Node.js
  test:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app:ro
    command: node tests/test.js
    profiles: ["test"]
